# One button: GitHub Actions → "Deploy to Fly" (.github/workflows/deploy.yml). By hand:
# fly launch --no-deploy --copy-config  →  fly volumes create ship_data --size 1  →  fly secrets set …  →  fly deploy
app = "crucero-luna-2026"
primary_region = "dfw"   # Dallas: closest Fly region to Acapulco (qro is no longer offered)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  PUBLIC_URL = "https://crucero-luna-2026.fly.dev"
  WHATSAPP_TEMPLATES = "off"
  SCHEDULER = "on"
  # Without DATABASE_URL the JSON store lives on the volume, so pilot data survives deploys.
  CRUCERO_DATA_FILE = "/data/crucero.json"
  # Real passengers only: the sample roster has fake phone numbers that broadcasts would try to reach.
  SEED_SAMPLE = "off"

[mounts]
  source = "ship_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"     # the scheduler must keep running
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
